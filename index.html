<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поверь мне брат — Свободная энциклопедия</title>
    <style>
        body { font-family: sans-serif; background: #f6f6f6; margin: 0; display: flex; }
        
        /* Боковая панель */
        aside { width: 160px; padding: 20px; font-size: 13px; border-right: 1px solid #a7d7f9; }
        aside img { width: 100%; margin-bottom: 20px; }
        
        /* Контент */
        main { flex-grow: 1; padding: 20px 40px; background: white; min-height: 100vh; }
        h1 { font-family: 'Linux Libertine', Georgia, serif; border-bottom: 1px solid #a2a9b1; padding-bottom: 5px; }
        
        .search-box { margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #a2a9b1; box-sizing: border-box; }
        button { background: #3366cc; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 2px; }
        button:hover { background: #4477dd; }

        #article-content { line-height: 1.6; }
        .source-footer { margin-top: 40px; font-style: italic; color: #54595d; border-top: 1px solid #a2a9b1; padding-top: 10px; }
    </style>
</head>
<body>

<aside>
    <img src="https://i.ibb.co/hR0W4hS/Gemini-Generated-Image-5ofgfb5ofgfb5ofg-removebg-preview.png" alt="Logo">
    <p><a href="#" onclick="location.reload()">Заглавная</a></p>
    <p>Случайная статья</p>
    <hr>
    <p><b>Источник:</b><br>Поверь мне брат</p>
</aside>

<main>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Поиск статьи (например: Мамонты)">
        <button id="search-btn">Найти</button>
        <button id="create-mode-btn" style="background:#444">Написать статью</button>
    </div>

    <div id="view-section">
        <h1 id="title-display">Добро пожаловать в Поверь мне брат</h1>
        <div id="article-content">
            Здесь вы найдете только самую "проверенную" информацию. Просто введите название в поиске или создайте новую статью.
        </div>
        <div class="source-footer" id="footer-source" style="display:none">
            Источник: <b>Поверь мне брат.</b>
        </div>
    </div>

    <div id="edit-section" style="display:none">
        <h1 id="edit-title-h">Создать новую статью</h1>
        <input type="text" id="new-title" placeholder="Название статьи">
        <textarea id="new-content" rows="10" placeholder="Текст статьи..."></textarea>
        <button id="save-btn">Опубликовать (чесслово)</button>
    </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2XqlGh-fAp1skwkA9eOyx8Rl-EzcPp9Y",
    authDomain: "pover-mne-bratishka.firebaseapp.com",
    projectId: "pover-mne-bratishka",
    storageBucket: "pover-mne-bratishka.firebasestorage.app",
    messagingSenderId: "633219407843",
    appId: "1:633219407843:web:96b57b4d636091b3598ad6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const articlesRef = collection(db, "articles");

  // Переключение режимов
  document.getElementById('create-mode-btn').onclick = () => {
      document.getElementById('view-section').style.display = 'none';
      document.getElementById('edit-section').style.display = 'block';
  };

  // Сохранение статьи
  document.getElementById('save-btn').onclick = async () => {
      const title = document.getElementById('new-title').value;
      const content = document.getElementById('new-content').value;

      if(title && content) {
          await addDoc(articlesRef, { 
              title: title.toLowerCase(), 
              displayTitle: title,
              content: content,
              date: new Date() 
          });
          alert("Брат, сохранил! Теперь все поверят.");
          location.reload();
      }
  };

  // Поиск статьи
  document.getElementById('search-btn').onclick = async () => {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const q = query(articlesRef, where("title", "==", searchTerm));
      const querySnapshot = await getDocs(q);

      if (!querySnapshot.empty) {
          const data = querySnapshot.docs[0].data();
          document.getElementById('title-display').innerText = data.displayTitle;
          document.getElementById('article-content').innerText = data.content;
          document.getElementById('footer-source').style.display = 'block';
          document.getElementById('view-section').style.display = 'block';
          document.getElementById('edit-section').style.display = 'none';
      } else {
          alert("Брат, такой статьи нет. Но ты можешь её создать!");
      }
  };
</script>

</body>
</html>
