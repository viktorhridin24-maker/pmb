<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поверь мне брат — Свободная энциклопедия</title>
    <link rel="icon" href="pmbfanicon.png" type="image/png">
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #f6f6f6;
            margin: 0;
            display: flex;
        }
        /* Боковая панель в стиле Вики */
        side-bar {
            width: 160px;
            padding: 20px;
            background: #f6f6f6;
        }
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
        /* Контент */
        main {
            flex-grow: 1;
            background: white;
            padding: 40px;
            border-left: 1px solid #a7d7f9;
            min-height: 100vh;
        }
        h1 {
            border-bottom: 1px solid #a2a9b1;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .auth-notice {
            background: #f8f9fa;
            border: 1px solid #eaecf0;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .btn {
            background: #36c;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        #article-content { line-height: 1.6; }
    </style>
</head>
<body>

<side-bar>
    <img src="pmb.png" alt="Лого" class="logo">
    <div style="font-size: 0.8em;">
        <p><a href="index.html">Заглавная</a></p>
        <p><a href="create.html" id="edit-link" style="display:none;">Создать статью</a></p>
    </div>
</side-bar>

<main>
    <div id="auth-status" class="auth-notice">
        Вы читаете как гость. <button onclick="login()">Войти (имитация)</button>
    </div>
    
    <h1 id="title">Загрузка...</h1>
    <div id="article-content">
        Выберите статью или подождите, пока брат подтянет инфу...
    </div>

    <div id="edit-section" style="display:none; margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px;">
        <a href="#" id="actual-edit-button" class="btn">Править статью</a>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD2XqlGh-fAp1skwkA9eOyx8Rl-EzcPp9Y",
        authDomain: "pover-mne-bratishka.firebaseapp.com",
        projectId: "pover-mne-bratishka",
        storageBucket: "pover-mne-bratishka.firebasestorage.app",
        messagingSenderId: "633219407843",
        appId: "1:633219407843:web:96b57b4d636091b3598ad6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Проверка "авторизации" (пока на локалсторадже для теста)
    const isAuth = localStorage.getItem('isAuth') === 'true';
    if(isAuth) {
        document.getElementById('auth-status').innerText = "Вы вошли как Брат (Редактор)";
        document.getElementById('edit-link').style.display = 'block';
        document.getElementById('edit-section').style.display = 'block';
    }

    // Получаем ID статьи из URL
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id') || 'main_page'; // по дефолту главная

    async function loadArticle() {
        const docRef = doc(db, "articles", articleId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('title').innerText = data.title;
            document.getElementById('article-content').innerHTML = data.content;
            document.title = data.title + " — Поверь мне брат";
            
            if(isAuth) {
                document.getElementById('actual-edit-button').href = `create.html?edit=${articleId}`;
            }
        } else {
            document.getElementById('title').innerText = "Статья не найдена";
            document.getElementById('article-content').innerText = "Походу, брат еще не написал об этом. Ты можешь стать первым!";
        }
    }

    window.login = () => {
        localStorage.setItem('isAuth', 'true');
        location.reload();
    }

    loadArticle();
</script>
</body>
</html>
