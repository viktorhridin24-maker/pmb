<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поверь мне брат — Свободная энциклопедия</title>
    <style>
        body { font-family: sans-serif; background: #f6f6f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border: 1px solid #a2a9b1; }
        h1 { border-bottom: 1px solid #a2a9b1; padding-bottom: 5px; }
        .wiki-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn { background: #3366cc; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 2px; }
        .btn:hover { background: #447ff5; }
        .article { margin-top: 30px; padding: 15px; border-left: 5px solid #3366cc; background: #f8f9fa; }
        .source { color: #72777d; font-style: italic; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Поверь мне брат</h1>
    <p>Это свободная энциклопедия, где пруфы не нужны.</p>

    <div style="background: #eee; padding: 15px; margin-bottom: 20px;">
        <h3>Создать новую истину</h3>
        <input type="text" id="title" class="wiki-input" placeholder="Заголовок (например: Почему небо синее?)">
        <textarea id="content" class="wiki-input" rows="4" placeholder="Текст статьи..."></textarea>
        <button class="btn" id="saveBtn">Опубликовать (Мамой клянусь)</button>
    </div>

    <div id="articlesList">
        <p>Загрузка легендарных фактов...</p>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2XqlGh-fAp1skwkA9eOyx8Rl-EzcPp9Y",
    authDomain: "pover-mne-bratishka.firebaseapp.com",
    projectId: "pover-mne-bratishka",
    storageBucket: "pover-mne-bratishka.firebasestorage.app",
    messagingSenderId: "633219407843",
    appId: "1:633219407843:web:96b57b4d636091b3598ad6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const articlesCol = collection(db, 'articles');

  // Функция для отрисовки статей
  async function loadArticles() {
    const q = query(articlesCol, orderBy("createdAt", "desc"));
    const querySnapshot = await getDocs(q);
    const listDiv = document.getElementById('articlesList');
    listDiv.innerHTML = '';

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const div = document.createElement('div');
      div.className = 'article';
      div.innerHTML = `
        <h2>${data.title}</h2>
        <p>${data.content}</p>
        <div class="source">Источник: поверь мне брат</div>
      `;
      listDiv.appendChild(div);
    });
  }

  // Сохранение новой статьи
  document.getElementById('saveBtn').onclick = async () => {
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;

    if(title && content) {
      await addDoc(articlesCol, {
        title: title,
        content: content,
        createdAt: new Date()
      });
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      loadArticles(); // Обновляем список
    } else {
      alert("Заполни поля, ну ты чего!");
    }
  };

  // Загружаем при старте
  loadArticles();
</script>

</body>
</html>
