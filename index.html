        /* Боковая панель (Sidebar) */
        #sidebar {
            width: 160px;

        }

        #content {

            padding: 15px;
            margin-bottom: 30px;
        }

        input, textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            font-family: "Times New Roman", serif;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            background-color: #3366cc;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4477dd;
        }

        .article-card {
            border-bottom: 1px solid #eaecf0;
            padding: 15px 0;
        }

        .article-card h2 {
            color: #0645ad;
            margin: 0;
        }

        .source-tag {
            font-style: italic;
            color: #72777d;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
