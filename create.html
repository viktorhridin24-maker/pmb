<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание страницы — Поверь мне брат</title>
    <link rel="icon" href="pmbfanicon.png" type="image/png">
    <style>
        body { font-family: "Times New Roman", serif; background: #f6f6f6; padding: 50px; }
        .editor-container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border: 1px solid #a2a9b1; }
        input, textarea, select { width: 100%; margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; font-family: inherit; }
        button { background: #3366cc; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; }
        .preview-box { border: 1px dashed #ccc; padding: 10px; background: #fffbe6; font-size: 0.9em; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="editor-container">
    <h2>Редактор «Поверь мне брат»</h2>
    <p>Выбери шаблон и заполни данные. Пруфы не нужны.</p>
    
    <label>Название статьи:</label>
    <input type="text" id="title" placeholder="Напр: Почему небо синее">

    <label>Шаблон оформления:</label>
    <select id="template" onchange="applyTemplate()">
        <option value="standard">Обычный текст</option>
        <option value="biography">Биография мема</option>
        <option value="scientific">«Научный» факт</option>
    </select>

    <label>Контент (поддерживает HTML):</label>
    <textarea id="content" rows="10" placeholder="Пиши сюда истину..."></textarea>

    <button id="save-btn">Опубликовать истину</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = { /* Тот же конфиг, что выше */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');

    // Если мы редактируем, подгружаем старые данные
    if (editId) {
        const docRef = doc(db, "articles", editId);
        const snap = await getDoc(docRef);
        if (snap.exists()) {
            document.getElementById('title').value = snap.data().title;
            document.getElementById('content').value = snap.data().content;
        }
    }

    window.applyTemplate = () => {
        const t = document.getElementById('template').value;
        const c = document.getElementById('content');
        if (t === 'biography') {
            c.value = "<b>Дата рождения:</b> Неизвестно<br><b>Место:</b> Интернет<br><b>Суть:</b> ...";
        } else if (t === 'scientific') {
            c.value = "Согласно секретным исследованиям британских учёных... <br><i>[Вставить сомнительный график]</i>";
        }
    };

    document.getElementById('save-btn').onclick = async () => {
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;
        const newId = editId || title.toLowerCase().replace(/\s+/g, '_'); // Генерируем ID из заголовка

        try {
            await setDoc(doc(db, "articles", newId), {
                title: title,
                content: content,
                timestamp: new Date()
            });
            alert("Опубликовано! Сейчас перебросим на страницу.");
            window.location.href = `index.html?id=${newId}`;
        } catch (e) {
            console.error("Ошибка, брат: ", e);
        }
    };
</script>
</body>
</html>
